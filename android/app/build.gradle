plugins {
    id 'com.android.application'
}

// El filtro de un srcDir de AGP no se respeta, así que las clases compartidas se sincronizan a build/
// desde ../../src/main/java con include/exclude. La PC (Swing, SQLite) queda afuera.
def copiarCompartido = tasks.register("copiarCompartido", Sync) {
    from("../../src/main/java") {
        include "com/rutina/registro/**", "com/rutina/model/Tipo.java", "com/rutina/model/Aproximacion.java"
        // Dependen del cálculo de la PC.
        exclude "com/rutina/registro/ArmadorPlan.java", "com/rutina/registro/AnalisisRegistro.java",
                "com/rutina/registro/ComparacionTipo.java", "com/rutina/registro/ResumenSesion.java"
    }
    into(layout.buildDirectory.dir("compartido/java"))
}

tasks.named('preBuild') { dependsOn(copiarCompartido) }

android {
    namespace 'com.rutina.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.rutina.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Lógica del registro compartida con el programa de la PC: se arma en build/ (no se copia nada al repo).
            java.srcDir(layout.buildDirectory.dir("compartido/java"))
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
